{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Bank Login</title>
    <link rel="stylesheet" href="{% static 'bank_app/style.css' %}">
</head>
<body>
    <div class="login-container">
        <h2>Bank Login</h2>
        
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <input type="text" name="username" placeholder="Username" required>
            </div>
            <div class="form-group">
                <input type="password" name="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn">Login</button>
        </form>
        
        <div class="links">
            <p><a href="{% url 'register' %}">Register as Customer</a></p>
            
            <p><a href="{% url 'register_manager' %}">Register as Manager</a></p>
        </div>
    </div>
</body>
</html>
